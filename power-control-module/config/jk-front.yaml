# Example configuration: Jeep JK two-module system, FRONT module.
# Power board variant MMSS, module address 0, mounted in the glovebox.
# Front lighting, ARB twin compressor relay and winch isolator on this module;
# it also taps the Jeep's buses and shares the vehicle signals with the rear
# module (jk-rear.yaml) over the accessory bus. See ../docs/13-multi-module-system.md.
#
# This file is the human-editable source. A host-side tool (planned, see
# ../firmware/README.md) validates it and compiles it to the parameter writes
# described in ../docs/06-can-protocol.md, or uploads it whole over USB.
# Units: A, V, ms, s, km/h, rpm. Rule grammar: ../docs/07-firmware.md.
#
# Expressions are evaluated left to right with no precedence, at most four
# terms: "A OR B AND C" means (A OR B) AND C.
#
# Switch panel convention: light buttons are latching in the panel (the panel
# owns the toggle state and its LED) and arrive as steady VIN levels; action
# buttons (winch arm) are momentary.

module:
  address: 0
  variant: MMSS            # must match the fitted slot classes or the
                           # mismatched output stays off (SLOT_MISMATCH)
  can:
    bitrate: 500000
    base_id: 0x6A0
    termination: true      # bus ends: this module and the rear module; move this
                           # termination to the panel when the panel is fitted at the dash end
    host_timeout_ms: 500
  peers: [1]               # read the rear module's broadcast frames
  current_budget_a: 60
  sleep_after_s: 30
  engine_running:
    rpm_signal: VS1        # falls back to VBAT > 13.2 V for 5 s if VS1 is stale
    rpm_threshold: 500

inputs:
  IN1: { name: arb_rocker, mode: ACTIVE_LOW }
  IN2: { name: ditch_toggle, mode: ACTIVE_LOW }   # trailer reverse moved to the rear module
  # Winch sense lines come through an external 10 k resistor, which with the
  # input's own divider reads ~0.77 x the line voltage. Low thresholds keep a
  # winch-loaded battery sag (8 V and below) reading as "live".
  IN3: { name: winch_live, mode: ACTIVE_HIGH, high_v: 4.0, low_v: 2.0 }   # winch-side stud
  IN4: { name: winch_coil, mode: ACTIVE_HIGH, high_v: 4.0, low_v: 2.0 }   # contactor coil +
  IN5: { name: bar_toggle, mode: ACTIVE_LOW }
  IN6: { name: pods_toggle, mode: ACTIVE_LOW }
  # Only if the CAN-IHS high-beam bit cannot be decoded. The JK headlamp feeds
  # carry pulsed voltage (why some LED headlamps need anti-flicker harnesses),
  # so the input averages over 50 ms instead of reading single samples.
  IN7: { name: spare_high_beam_tap, mode: ACTIVE_HIGH, average_ms: 50 }
  IN8: { name: spare, mode: DISABLED }

# Vehicle signals. Entries with verified: false are skipped by the compiler
# (treated as not configured) until a capture on this JK confirms them —
# see ../docs/11-jeep-jk-integration.md#sniffing-procedure.
vehicle_signals:
  VS1:
    name: engine_rpm
    bus: CAN2              # OBD port; switch to CAN3 if CAN-IHS carries RPM
    type: obd_pid
    pid: 0x0C              # SAE J1979: (256*A + B) / 4
    scale: rpm
    timeout_ms: 1000
    verified: false        # needs the CAN2 TXD jumper and obd_polling.enabled
  VS2:
    name: vehicle_speed
    bus: CAN2
    type: obd_pid
    pid: 0x0D              # SAE J1979: A km/h
    scale: km/h
    timeout_ms: 1000
    verified: false
  VS3:
    name: high_beam
    bus: CAN3              # CAN-IHS, 125 kbit/s, receive-only
    type: broadcast
    can_id: 0x208          # community report; may be 0x308 -- confirm
    start_bit: 5           # byte 0 bit 5
    length: 1
    byte_order: little
    timeout_ms: 1000
    verified: false
  VS4:
    name: low_beam
    bus: CAN3
    type: broadcast
    can_id: 0x208
    start_bit: 4
    length: 1
    byte_order: little
    timeout_ms: 1000
    verified: false
  VS5:
    name: parking_lamps
    bus: CAN3
    type: broadcast
    can_id: 0x208
    start_bit: 3
    length: 1
    byte_order: little
    timeout_ms: 1000
    verified: false
  # Still to find by sniffing (2016 Rubicon):
  # VS6: transfer_case_4lo -- cluster indicator, so likely on CAN-IHS; useful as an
  #      "off-road mode" condition for the light bar and rock lights
  # VS7: lockers_engaged / sway_bar_disconnected -- Rubicon-only indicators
  # VS8: door_ajar -- rock-light courtesy

obd_polling:
  enabled: false           # also requires the CAN2 TXD solder jumper
  max_requests_per_s: 10

outputs:
  OUT1:
    name: light_bar
    class: M
    rating_a: 20
    soft_start_ms: 200     # tames the bar driver's capacitive inrush
    pwm: false             # this bar's internal driver does not dim cleanly
    on_host_loss: "HOLD"   # quoted throughout: a bare OFF would parse as a YAML boolean
    hold_s: 10
    shed_priority: 3       # 1 = shed first
    shed_ign_off: true
    rule:
      behaviour: follow
      condition: "VIN1 is_on OR IN5 is_on"
      # Optional road-courtesy interlock: bar only while high beams are on.
      # condition: "VIN1 is_on OR IN5 is_on AND VS3 is_on"
      force_off: "IGN is_off"
      override: [IN5]      # dash toggle wins over the panel

  OUT2:
    name: front_pods
    class: M
    rating_a: 15
    on_host_loss: "HOLD"
    hold_s: 10
    shed_priority: 4
    shed_ign_off: true
    rule:
      behaviour: follow
      condition: "VIN2 is_on OR IN6 is_on"
      force_off: "IGN is_off"
      override: [IN6]

  OUT3:
    name: ditch_lights     # A-pillar pods
    class: S
    rating_a: 10
    on_host_loss: "HOLD"
    hold_s: 10
    shed_priority: 2
    shed_ign_off: true
    rule:
      behaviour: follow
      condition: "VIN3 is_on OR IN2 is_on"
      force_off: "IGN is_off"
      override: [IN2]

  OUT4:
    name: front_rock_lights   # the rear module's rock lights follow this output
    class: S
    rating_a: 10
    pwm: { frequency_hz: 200, default_duty: 60 }
    soft_start_ms: 500
    on_host_loss: "HOLD"
    hold_s: 10
    shed_priority: 1
    shed_ign_off: true     # camp use is fine until the battery hits 12.0 V
    rule:
      behaviour: follow
      condition: "VIN4 is_on"
      max_on_s: 1800       # courtesy timer: off after 30 min
      force_off: "VS2 > 15 for 3000"

aux:
  AUX1:
    name: arb_compressor_relay   # coil fed through ARB's pressure switch
    rating_a: 2
    retries: 1
    on_host_loss: "RELEASE"
    rule:
      behaviour: follow
      condition: "IN1 is_on AND ENGINE_RUNNING is_on"
      # Interlocks a CAN request cannot bypass: rocker off, engine off, or the
      # charging system not keeping up (hysteresis stops it cycling as VBAT
      # recovers once the compressor stops).
      force_off: "IN1 is_off OR ENGINE_RUNNING is_off OR VBAT < hysteresis(12.0, 12.8) for 10000"
      max_load_on_s: 1200                      # 20 min of continuous running -> RUN_LIMIT
      load_on_threshold_a: 0.08                # coil current = compressor running

  AUX2:
    name: winch_isolator         # economised contactor coil, via diode D1
    rating_a: 5
    inrush_ms: 200               # 3.8 A pull-in for ~130 ms
    retries: 0
    on_host_loss: "HOLD"
    hold_s: 1800                 # never open mid-pull because the panel rebooted
    feedback:
      sense: IN3                 # winch side live
      command_sense: IN4         # coil energised by AUX2 or the override switch
      close_timeout_ms: 500
      open_timeout_ms: 2000
    rule:
      behaviour: toggle
      condition: "VIN5 is_on for 2000"         # long press on the panel arms / disarms
      force_off: "IGN is_off for 60000 OR VS2 > 10 for 5000"
      max_on_s: 1800                           # auto-disarm after 30 min...
      max_on_defer: "VBAT_SAG is_on"           # ...but not while the winch is pulling
      max_on_warning_s: 60                     # panel blinks before a timer disarm

  AUX3:
    name: arb_rocker_indicator
    rating_a: 0.5
    rule:
      behaviour: follow
      condition: "AUX1_I > 0.08"               # steady while the compressor runs
      flash:
        - { when: "AUX1_FAULT is_on", pattern: fast }                          # RUN_LIMIT etc.
        - { when: "IN1 is_on AND ENGINE_RUNNING is_off", pattern: slow }       # blocked

  AUX4:
    name: spare
    rating_a: 5
