# Example configuration: Jeep JK two-module system, REAR module.
# Power board variant SSSS, module address 1, mounted inside the Tuffy 282-01
# cargo enclosure. Drives the RIGID Chase 90133 pod (AUX1-4 and OUT3) and the
# Hobbs halogen rear floods (OUT1), with slots for rear rock lights and camp
# lights if those get fitted.
# Lamp signals come from the factory tail-light and third-brake-light harnesses.
# Vehicle signals (speed, RPM) come from the front module (jk-front.yaml) over
# the accessory bus as M0.<signal>.
# See ../docs/13-multi-module-system.md and the rule grammar in ../docs/07-firmware.md.
#
# Expressions are evaluated left to right with no precedence, at most four
# terms. A remote source that is stale (front module silent) reads false.

module:
  address: 1
  variant: SSSS
  can:
    bitrate: 500000
    base_id: 0x6A0           # module 1 frames are 0x6B0-0x6BF
    termination: true        # rear end of the accessory bus
    host_timeout_ms: 500
  peers: [0]                 # read the front module's broadcast frames
  current_budget_a: 30
  sleep_after_s: 30
  ign_source: local          # IGN wire in the front-rear trunk cable; M0.IGN is the fallback
  feed_resistance_mohm: 13.1 # 4 m of 10 AWG: VBAT_EST = VBAT + module current x feed resistance
  engine_running:
    rpm_signal: M0.VS1       # the front module's RPM signal; VBAT fallback as usual
    rpm_threshold: 500

inputs:
  # Lamp signals tapped at the factory tail-light connectors; debounce rejects
  # the vehicle's lamp-check pulses.
  IN1: { name: reverse_lamp, mode: ACTIVE_HIGH, high_v: 7.0, low_v: 5.0,
         debounce_on_ms: 50, debounce_off_ms: 300 }
  IN2: { name: third_brake_light, mode: ACTIVE_HIGH,       # spare-tire carrier lamp feed:
         debounce_on_ms: 10, debounce_off_ms: 50 }          # verify it is brake-only with a meter
  # Combined stop/turn. The band covers normal flashing and LED hyperflash.
  IN3: { name: left_stop_turn, mode: FREQUENCY, turn_band_hz: [0.8, 4.0] }
  IN4: { name: right_stop_turn, mode: FREQUENCY, turn_band_hz: [0.8, 4.0] }
  IN5: { name: tail_lamps, mode: ACTIVE_HIGH }
  IN6: { name: camp_switch, mode: ACTIVE_LOW }             # switch at the tailgate
  IN7: { name: spare, mode: DISABLED }
  IN8: { name: spare, mode: DISABLED }

vehicle_signals: {}          # none on this module: it has no vehicle CAN taps

obd_polling:
  enabled: false

outputs:
  OUT1:
    name: rear_floods        # Hobbs 4x6 sealed halogen work floods. Assumed two 12 V
    class: S                 # 50 W lamps (~8 A) until the label or a 12 V bench test
    rating_a: 10             # confirms voltage and wattage (doc 13)
    pwm: { frequency_hz: 200, default_duty: 100 }  # halogen dims cleanly
    soft_start_ms: 300       # warms the filaments: cold, they draw ~10x running current
    inrush_ms: 300           # instantaneous limit at the hardware level during the ramp
    max_supply_v: 16.0       # a 12 V filament at 24 V burns out
    # open_load_a: ~75 % of the pair current measured in SY-8, so one dead lamp is flagged
    on_host_loss: "RELEASE"
    shed_priority: 2
    shed_ign_off: true
    rule:
      behaviour: follow
      condition: "IN1 is_on OR VIN1 is_on"     # reverse, or the panel button
      off_delay_s: 60
      force_off: "M0.VS2 > 15 for 3000"        # front module's vehicle speed

  OUT2:
    name: rear_rock_lights   # placeholder
    class: S
    rating_a: 10
    pwm: { frequency_hz: 200, default_duty: 60 }
    soft_start_ms: 500
    on_host_loss: "HOLD"
    hold_s: 10
    shed_priority: 1
    shed_ign_off: true
    rule:
      behaviour: follow
      condition: "M0.OUT4 is_on OR VIN2 is_on" # follow the front rock lights
      max_on_s: 1800
      force_off: "M0.VS2 > 15 for 3000"

  OUT3:
    name: chase_courtesy     # Chase green wire, 0.3 A. No open-load check: 0.3 A is
    class: S                 # inside an S channel's +/-0.3 A low-current error (FN-3)
    rating_a: 1
    inrush_ms: 50            # the light's driver charges its input capacitance
    max_supply_v: 16.0
    on_host_loss: "RELEASE"
    shed_priority: 3
    shed_ign_off: true
    rule:
      behaviour: follow
      condition: "IN6 is_on OR VIN7 is_on"
      max_on_s: 1800

  OUT4:
    name: camp_lights        # placeholder
    class: S
    rating_a: 10
    pwm: { frequency_hz: 200, default_duty: 80 }
    soft_start_ms: 300
    on_host_loss: "HOLD"
    hold_s: 10
    shed_priority: 3
    shed_ign_off: true
    rule:
      behaviour: follow
      condition: "IN6 is_on OR VIN4 is_on"
      max_on_s: 7200             # off after 2 h

# RIGID Chase 90133, wire map from RIGID's installation sheet PKG-IS-215-A
# (current at 14 V): red low-power trail light 0.3 A, white high-power brake
# 1.3 A, yellow high-power strobe 1.3 A, blue reverse 0.7 A, green
# cargo/courtesy 0.3 A (on OUT3), black ground. Each colour feeds its own
# function; there is no separate power wire. Rated 9-15 V only: no
# PWM, no keep-alive, and every Chase output switches off above max_supply_v
# (24 V jump start, failed regulator). Ratings are ~1.5x the 14 V current,
# with headroom for the higher current some LED drivers draw at low voltage.
aux:
  AUX1:
    name: chase_trail            # red
    rating_a: 1
    open_load_a: 0.1
    max_supply_v: 16.0
    on_host_loss: "RELEASE"
    rule:
      behaviour: follow
      condition: "IN5 is_on"
      force_off: "IGN is_off"

  AUX2:
    name: chase_brake            # white
    rating_a: 2
    open_load_a: 0.4
    max_supply_v: 16.0
    rule:
      behaviour: follow
      condition: "IN2 is_on"

  AUX3:
    name: chase_strobe           # yellow. Off-road use: red strobes to the rear
    rating_a: 2                  # are restricted on public roads. Flashing load:
    max_supply_v: 16.0           # no open-load check.
    on_host_loss: "OFF"
    rule:
      behaviour: follow
      condition: "VIN6 is_on"
      force_off: "IGN is_off OR IN2 is_on"   # brake always shows; revisit after SY-7

  AUX4:
    name: chase_reverse          # blue (white light)
    rating_a: 1.5
    open_load_a: 0.2
    max_supply_v: 16.0
    on_host_loss: "RELEASE"
    rule:
      behaviour: follow
      condition: "IN1 is_on OR VIN1 is_on"
      off_delay_s: 30
      force_off: "M0.VS2 > 15 for 3000"

# No keep-alive on this module: a 5-8 V keep-alive is below the Chase's rated
# 9-15 V, and the factory tail lamps need none. KA1 and KA2 stay unused.
